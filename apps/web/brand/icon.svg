<!--
  Single source for every generated PWA icon. Colours and geometry are supplied by
  apps/web/scripts/generate-pwa-assets.mts from the theme preset, so the icon can
  never drift from the token set. Rendering this file without those custom
  properties is expected to look unpainted; run the generator instead.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="xpresso mark">
  <style>
    .plate { rx: var(--icon-corner); ry: var(--icon-corner); fill: var(--icon-background); }
    .mark {
      stroke: var(--icon-mark);
      stroke-width: 62;
      stroke-linecap: round;
      transform: scale(var(--icon-mark-scale));
      transform-origin: 256px 256px;
    }
  </style>
  <rect class="plate" x="0" y="0" width="512" height="512" />
  <g class="mark">
    <line x1="150" y1="150" x2="362" y2="362" />
    <line x1="362" y1="150" x2="150" y2="362" />
  </g>
</svg>
